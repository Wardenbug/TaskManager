<mat-form-field class="full-width">
    <mat-label>{{ label }}</mat-label>
    <input matInput placeholder="pat@example.com" [formControlName]="controlKey" (blur)="updateErrorMessage()"
        required />

    @if (parentFormGroup.get(controlKey)?.invalid) {
    <mat-error>{{ errorMessage() }}</mat-error>
    }
</mat-form-field>
